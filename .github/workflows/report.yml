name: report

# Report mensile (docs/dashboard.md, «Report mensile»): il 1° del mese, dopo la sync notturna,
# genera il report del mese precedente e lo salva in D1 (tabelle reports e metrics); un nuovo
# salvataggio dello stesso mese sostituisce il precedente. A mano: workflow_dispatch, con il
# mese AAAA-MM facoltativo.
on:
  schedule:
    - cron: "37 5 1 * *" # il 1° di ogni mese, 05:37 UTC (la sync notturna gira alle 03:17 UTC)
  workflow_dispatch:
    inputs:
      month:
        description: "Mese del report (AAAA-MM); vuoto = mese precedente, ora di Roma"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Log: solo "report salvato" o la riga d'errore della CLI, mai il contenuto del report.
      # Il mese arriva dall'ambiente, mai interpolato nello script; la CLI lo valida (exit 64).
      - name: Generate the monthly report into D1
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CF_TOKEN_D1: ${{ secrets.CF_TOKEN_D1 }}
          REPORT_MONTH: ${{ inputs.month }}
        run: |
          month="${REPORT_MONTH:-$(TZ=Europe/Rome date -d "$(TZ=Europe/Rome date +%Y-%m-01) -1 day" +%Y-%m)}"
          npm run --silent report -- --month "$month"
