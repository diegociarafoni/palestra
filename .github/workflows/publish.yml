name: publish

# Pubblicazione della dashboard su Cloudflare Pages (docs/dashboard.md, «Pubblicazione»), solo a
# mano e solo da main. Prima del deploy controlla che Cloudflare Access protegga l'hostname della
# dashboard e il dominio pages.dev del progetto e, se non li protegge, si ferma senza pubblicare;
# dopo il deploy ripete il controllo e verifica che l'API risponda 401 alle richieste con
# X-Requested-With senza sessione.
# Log: solo esiti ed exit code, mai l'hostname, gli URL o l'output di wrangler.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # `--branch main` pubblica in produzione qualunque sia il ref scelto in «Use workflow from»:
    # da un altro branch andrebbe online codice non ancora unito a main, quindi il job non parte.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      # Mai pubblicare senza Access attivo (CLAUDE.md): exit 78 qui ferma il job prima del deploy.
      # Hostname della dashboard e dominio pages.dev del progetto arrivano da due Secret e solo ai
      # due passi di controllo (npm ci e la build non li vedono): GitHub stampa nel log pubblico il
      # blocco env di ogni passo, dove un Secret compare come *** e una Variable in chiaro.
      - name: Check that Cloudflare Access protects the dashboard
        timeout-minutes: 2
        env:
          DASHBOARD_HOSTNAME: ${{ secrets.DASHBOARD_HOSTNAME }}
          PAGES_HOSTNAME: ${{ secrets.PAGES_HOSTNAME }}
        run: npx --no -- tsx src/cli/check-access.ts
      # Output di wrangler scartato: contiene gli URL del progetto e degli alias. Binding e
      # variabili delle Functions vengono dalle impostazioni del progetto Pages (nessun wrangler.toml).
      - name: Deploy site/ and functions/ to Cloudflare Pages
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_TOKEN_PAGES }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_WRITE_LOGS: "false"
        run: |
          if npx --no -- wrangler pages deploy site --project-name palestra --branch main </dev/null >/dev/null 2>&1; then
            echo "Deploy riuscito"
          else
            code=$?
            echo "Deploy non riuscito (wrangler exit $code)"
            exit "$code"
          fi
      - name: Check Access again and the 401 for API requests
        timeout-minutes: 2
        env:
          DASHBOARD_HOSTNAME: ${{ secrets.DASHBOARD_HOSTNAME }}
          PAGES_HOSTNAME: ${{ secrets.PAGES_HOSTNAME }}
        run: npx --no -- tsx src/cli/check-access.ts --after-deploy
